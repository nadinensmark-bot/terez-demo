<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SensiHome PAW | Stylová kolekce, která pomáhá</title>
  <meta name="description" content="Merch SensiHome PAW. Podpořte projekt bezpečného domova pro psy se smyslovým hendikepem.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div id="site-header"></div>

  <section class="hero">
    <div class="wrap">
      <div class="text">
        <h1>SensiHome PAW</h1>
        <div class="sub">Stylová kolekce, která pomáhá
          <svg class="underline" viewBox="0 0 300 10" preserveAspectRatio="none"><path d="M2 7c60-5 180-6 296-2" fill="none" stroke="#1aa3a6" stroke-width="3" stroke-linecap="round"/></svg>
          <svg class="heart" viewBox="0 0 40 40"><path d="M20 33s-12-7.5-12-16a7 7 0 0 1 12-4.5A7 7 0 0 1 32 17c0 8.5-12 16-12 16z" fill="none" stroke="#1aa3a6" stroke-width="2.5"/></svg>
        </div>
        <p class="lead">Podpořte projekt bezpečného domova pro psy se&nbsp;smyslovým hendikepem.</p>
        <a class="btn" href="#produkty">Prohlédnout kolekci →</a>
      </div>
      <div class="photo">
        <img src="assets/img/hero-malvinka.jpg" alt="Malvínka" fetchpriority="high">
        <div class="sign hand">Malvínka ♡</div>
      </div>
      <div class="paws left" data-paws></div>
    </div>
  </section>

  <section class="cats" id="produkty">
    <div class="wrap">
      <ul id="cats"></ul>
    </div>
  </section>

  <section class="products">
    <div class="wrap">
      <div class="grid" id="grid"></div>
    </div>
  </section>

  <section class="benefits">
    <div class="wrap"><div class="box" data-benefits></div></div>
  </section>

  <div id="site-footer"></div>
  <script src="config.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
